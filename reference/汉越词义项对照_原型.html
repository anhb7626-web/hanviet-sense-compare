  return isTrap(w)?'<span class="tag trap">Có bẫy</span>':'<span class="tag ok">Giống tiếng Việt</span>';
}
function nav(on){$("#n-look").classList.toggle("on",on==="look");$("#n-quiz").classList.toggle("on",on==="quiz");window.scrollTo(0,0)}

/* Trang chủ */
function home(){
  nav("");
  V.innerHTML=`<div class="wrap" style="padding-top:24px">
   <h1>Từ Hán Việt <em>trông quen</em>, nhưng nghĩa chưa chắc giống.</h1>
   <p class="lead">Người Việt học tiếng Trung hay đoán nghĩa theo âm Hán Việt. Phần lớn đoán đúng, nhưng có những từ đoán sai mà không biết. Trang này chỉ ra <b>sai ở nghĩa nào</b> và <b>nên hiểu thế nào</b>.</p>
   <div class="search"><input id="s" placeholder="Gõ một từ: 义务, nghĩa vụ, yiwu…" aria-label="Tìm từ"></div>
   <div class="sugg">Thử: ${words.filter(isTrap).slice(0,4).map(w=>`<button class="chip trap" data-go="${w.id}"><span class="h">${w.zh}</span> ${w.vi}</button>`).join("")}</div>
   <p class="lbl">Ví dụ</p>
   <div class="demo">
     <div class="w"><span class="han big">义务</span><span style="color:var(--muted)">yìwù · nghĩa vụ</span></div>
     <div class="box think"><b class="t">Bạn sẽ nghĩ</b>“Nghĩa vụ”, tức việc bắt buộc phải làm.</div>
     <div class="box real"><b class="t">Nhưng trong câu này</b><span class="han">他周末去社区<u>义务</u>教老人用手机。</span><br>义务 = <b>không lấy tiền, tình nguyện</b>.</div>
   </div>
   <div class="ways">
     <button class="way" id="w-look"><b>Tra một từ</b><span>Xem từng nghĩa Hán–Việt đặt cạnh nhau, có câu ví dụ.</span><span class="go">Mở danh sách →</span></button>
     <button class="way" id="w-quiz"><b>Tôi có bị “bẫy” không?</b><span>8 câu, khoảng 2 phút. Biết ngay mình hay hiểu lệch ở đâu.</span><span class="go">Bắt đầu →</span></button>
   </div>
   <div class="who">
     <div><b>Người học</b><p>Biết từ nào không được đoán theo tiếng Việt, học đúng nghĩa trước khi dùng sai.</p></div>
     <div><b>Giáo viên</b><p>Biết trước chỗ học sinh Việt dễ hiểu sai, có sẵn câu ví dụ đối chiếu để dạy.</p></div>
   </div></div>`;
  $("#s").addEventListener("keydown",e=>{if(e.key==="Enter")list(e.target.value)});
  $("#s").addEventListener("input",e=>{if(e.target.value.trim())list(e.target.value,true)});
  $("#w-look").onclick=()=>list("");$("#w-quiz").onclick=quizStart;
}

/* Danh sách */
function list(q="",keepFocus){
  nav("look");
  V.innerHTML=`<div class="wrap" style="padding-top:20px">
   <div class="search"><input id="s2" value="${q.replace(/"/g,"")}" placeholder="Gõ chữ Hán, tiếng Việt hoặc pinyin" aria-label="Tìm từ"></div>
   <div class="list" id="rows"></div></div>`;
  const inp=$("#s2");
  const draw=()=>{const k=inp.value.trim().toLowerCase();
    const r=words.filter(w=>!k||[w.zh,w.vi,w.py].join(" ").toLowerCase().includes(k));
    $("#rows").innerHTML=r.length?r.map(w=>`<button class="row" data-go="${w.id}"><span><span class="h">${w.zh}</span><span class="v">${w.vi}</span></span>${tag(w)}</button>`).join(""):'<p style="padding:14px 16px;margin:0;color:var(--muted)">Chưa có từ này. Bản mẫu hiện có 10 từ thuộc nhóm 忠/义.</p>';};
  inp.addEventListener("input",draw);draw();
  if(keepFocus){inp.focus();inp.setSelectionRange(inp.value.length,inp.value.length)}
}

/* Trang từ */
function word(id){
  nav("look");
  const w=words.find(x=>x.id===id),ss=sensesOf(id),trap=isTrap(w);
  const ex=(s,l)=>examples.filter(e=>e.s===s.id&&e.lang===l).map(e=>`<li class="${l==="zh"?"han":""}">${e.t}</li>`).join("");
  const on=new Set(ss.flatMap(s=>s.dims));
  V.innerHTML=`<div class="wrap" style="padding-top:20px">
   <button class="back" id="bk">← Danh sách từ</button>
   <div class="whead"><span class="han big">${w.zh}</span><span class="m">${w.py} · Hán Việt: <b style="color:var(--ink)">${w.vi}</b> · HSK ${w.hsk}</span>${tag(w)}</div>
   <div class="verdict ${w.status==="未测试"?"wait":trap?"trap":"ok"}">${gist[id]||"Nghĩa cơ bản <b>giống tiếng Việt</b>, có thể hiểu theo âm Hán Việt."}</div>
   <p class="lbl">${ss.length} nghĩa</p>
   ${ss.map((s,i)=>{const [lb,c]=relLabel[s.rel];return `<div class="sense ${c==="trap"?"trap":""}">
     <div class="sh"><b>Nghĩa ${i+1}</b><span class="tag ${c}">${lb}</span></div>
     <div class="two"><div class="box think"><b class="t">Tiếng Trung</b><span class="han">${s.zh}</span><ul class="ex">${ex(s,"zh")}</ul></div>
     <div class="box ${c==="trap"?"real":"think"}"><b class="t">Tiếng Việt</b>${s.vi}${ex(s,"vi")?`<ul class="ex">${ex(s,"vi")}</ul>`:""}</div></div></div>`}).join("")}
   <details><summary>Dành cho giáo viên và nghiên cứu</summary>
     <div class="dims">${["对象指向","义项范围","色彩","搭配"].map(d=>`<span class="dim ${on.has(d)?"on":""}">${d}</span>`).join("")}</div>
     <p style="margin:10px 0 0">Loại lệch: ${w.type} · Nhóm ${w.group} · Mã: ${w.id} / ${ss.map(s=>s.id).join(", ")}</p>
     <p style="margin:4px 0 0">Dữ liệu người học: ${ss.map(s=>stats[s.id]?`${s.id} đúng ${Math.round(stats[s.id].acc*100)}% (n=${stats[s.id].n})`:null).filter(Boolean).join("; ")||"sẽ cập nhật sau khảo sát chính thức"}.</p>
   </details></div>`;
  $("#bk").onclick=()=>list("");
}

/* Tự kiểm tra */
let qi=0,score=0,log=[];
function quizStart(){qi=0;score=0;log=[];nav("quiz");renderQ()}
function renderQ(){
  if(qi>=items.length)return result();
  const it=items[qi];
  V.innerHTML=`<div class="wrap" style="padding-top:20px"><div class="card">
   <div class="sh"><span class="lbl">Câu ${qi+1}/${items.length}</span><span class="lbl">Từ gạch chân nghĩa là gì?</span></div>
   <div class="bar"><i style="width:${qi/items.length*100}%"></i></div>
   <p class="q">${it.stem}</p>
   <div class="opts">${it.opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="han">${o}</span></button>`).join("")}</div>
   <div id="fb"></div></div></div>`;
}
function result(){
  const traps=log.filter(l=>l.trap).length;
  const ws=[...new Set(log.filter(l=>!l.ok).map(l=>senses.find(s=>s.id===l.it.s).w))];
  V.innerHTML=`<div class="wrap" style="padding-top:20px"><div class="card">
   <span class="lbl">Kết quả</span><span class="score">${score}/${items.length}</span>
   <p style="margin:0">${traps?`Có <b>${traps}</b> câu bạn hiểu theo nghĩa tiếng Việt. Đó chính là “bẫy” Hán Việt.`:"Bạn không mắc bẫy Hán Việt nào. Rất tốt!"}</p>
   ${ws.length?`<div><p class="lbl">Nên xem lại</p><div class="sugg" style="margin-top:6px">${ws.map(id=>{const w=words.find(x=>x.id===id);return `<button class="chip trap" data-go="${id}"><span class="h">${w.zh}</span> ${w.vi}</button>`}).join("")}</div></div>`:""}
   <button class="btn ghost" id="again">Làm lại</button></div></div>`;
}
V.addEventListener("click",e=>{
  const g=e.target.closest("[data-go]");if(g)return word(g.dataset.go);
  const o=e.target.closest(".opt");
  if(o&&!o.disabled){
    const it=items[qi],i=+o.dataset.i,ok=i===it.ans,trap=!ok&&i===it.trap;
    if(ok)score++;log.push({it,ok,trap});
    document.querySelectorAll(".opt").forEach((b,k)=>{b.disabled=true;if(k===it.ans)b.classList.add("right");else if(k===i)b.classList.add("wrong")});
    const s=senses.find(x=>x.id===it.s);
    $("#fb").innerHTML=`<div class="fb ${ok?"r":"w"}">${ok?"<b>Đúng.</b> ":trap?"<b>Bạn đã hiểu theo nghĩa tiếng Việt.</b> ":"<b>Chưa đúng.</b> "}${s.warn||""}</div>
     <div style="display:flex;justify-content:flex-end;margin-top:12px"><button class="btn" id="next">${qi+1<items.length?"Câu tiếp →":"Xem kết quả"}</button></div>`;
    return;
  }
  if(e.target.id==="next"){qi++;renderQ()}
  if(e.target.id==="again")quizStart();
});
$("#home").onclick=home;$("#n-look").onclick=()=>list("");$("#n-quiz").onclick=quizStart;
home();
</script>
